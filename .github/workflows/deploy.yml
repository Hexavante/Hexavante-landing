name: Deploy Landing to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-landing
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.ENABLE_VPS_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Sync source
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          ssh -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete             --exclude '.git/'             --exclude '.github/'             --exclude '.env'             --exclude '.env.*'             --exclude 'node_modules/'             --exclude '.next/'             -e "ssh -p ${VPS_PORT:-22}"             ./ "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"

      - name: Build and restart Landing
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          ssh -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "cd '$DEPLOY_PATH' && docker build -t hexavante-landing:latest . && docker rm -f hexavante-landing 2>/dev/null || true; cd '$DEPLOY_PATH' && docker run -d --name hexavante-landing --restart unless-stopped -p 127.0.0.1:3001:3001 hexavante-landing:latest && docker image prune -f"
